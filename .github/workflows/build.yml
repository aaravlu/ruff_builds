name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    env:
      PROJECT_REPOSITORY: astral-sh/ruff
      PROJECT_VERSION: v0.14.14
      PROJECT_PATH: ruff
      PROJECT_BIN: ruff
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows config
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Checkout self
        uses: actions/checkout@v6

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: astral-sh/ruff
          ref: refs/tags/0.14.10
          path: ruff

      - name: Copy config file
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p .cargo
          cp -f ../.cargo/config.toml .cargo

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          rm -f Cargo.lock
          cargo update
          cargo b -r

      - name: Archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_BIN }}_${{ runner.os }}
          path: |
            ${{ env.PROJECT_PATH }}/target/release/*.so
            ${{ env.PROJECT_PATH }}/target/release/*.dll

            ${{ env.PROJECT_PATH }}/target/release/ty
            ${{ env.PROJECT_PATH }}/target/release/ty.exe
            ${{ env.PROJECT_PATH }}/target/release/ty_completion_eval
            ${{ env.PROJECT_PATH }}/target/release/ty_completion_eval.exe
            ${{ env.PROJECT_PATH }}/target/release/ruff_python_formatter
            ${{ env.PROJECT_PATH }}/target/release/ruff_python_formatter.exe

            ${{ env.PROJECT_PATH }}/target/release/${{ env.PROJECT_BIN }}
            ${{ env.PROJECT_PATH }}/target/release/${{ env.PROJECT_BIN }}.exe
