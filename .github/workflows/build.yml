name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable long paths in git
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true

      - name: Enable long paths in windows
        if: matrix.os == 'windows-2022'
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout ruff
        uses: actions/checkout@v4
        with:
          repository: astral-sh/ruff
          ref: refs/tags/0.14.2
          path: ruff

      - name: Replace cargo config
        shell: pwsh
        run: |
          Move-Item -Path ".cargo/config.toml" -Destination "ruff/.cargo" -Force
          cat ruff/.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install clippy
        run: |
          rustup component add clippy

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          workspaces: "ruff -> target"

      - name: Cargo fix
        working-directory: ruff
        run: |
          cargo fix --all --allow-dirty
          cargo clippy --fix --all --allow-dirty

      - name: Build
        working-directory: ruff
        run: |
          cargo b -r

      - name: Archive binary
        uses: actions/upload-artifact@v4
        with:
          name: ruff
          path: |
            ruff/target/release/ruff
            ruff/target/release/ruff.exe
