name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Checkout self
        uses: actions/checkout@v6

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: astral-sh/ruff
          ref: refs/tags/0.14.10
          path: ruff

      - name: Copy config
        shell: bash
        run: |
          mkdir -p ruff/.cargo
          cp -f .cargo/config.toml ruff/.cargo

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build
        working-directory: ruff
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo update
          cargo b -r

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: ruff_${{ matrix.os }}
          path: |
            ruff/target/release/*.so
            ruff/target/release/*.dll

            ruff/target/release/ty
            ruff/target/release/ty.exe

            ruff/target/release/ty_completion_eval
            ruff/target/release/ty_completion_eval.exe

            ruff/target/release/ruff
            ruff/target/release/ruff.exe

            ruff/target/release/ruff_python_formatter
            ruff/target/release/ruff_python_formatter.exe
